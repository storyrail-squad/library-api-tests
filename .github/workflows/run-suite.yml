name: Run API acceptance suite

# Reusable: runs the Cucumber suite against either a jar started on the runner (isolated) or a deployed API (QA).
# Called by this repo's ci.yml and by library-backend's ci-cd.yml.
on:
  workflow_call:
    inputs:
      base-url:
        description: API under test. Use http://localhost:8080 together with jar-artifact for an isolated run.
        type: string
        required: true
      jar-artifact:
        description: Name of an artifact in the calling run that holds library-backend.jar. Empty = don't start a jar.
        type: string
        default: ""
      tags:
        description: Cucumber tag expression.
        type: string
        default: "not @wip"
      tests-ref:
        description: Git ref of library-api-tests to run.
        type: string
        default: main
      report-name:
        description: Name of the uploaded report artifact.
        type: string
        default: api-acceptance-report

permissions:
  contents: read

jobs:
  suite:
    name: Cucumber (${{ inputs.tags }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_BASE_URL: ${{ inputs.base-url }}
      TAGS: ${{ inputs.tags }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: storyrail-squad/library-api-tests
          ref: ${{ inputs.tests-ref }}
          path: api-tests
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: api-tests/pom.xml

      - name: Download the backend jar
        if: ${{ inputs.jar-artifact != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.jar-artifact }}
          path: app

      - name: Start the API and wait for /actuator/health (60 s)
        if: ${{ inputs.jar-artifact != '' }}
        run: |
          nohup java -jar app/library-backend.jar > app.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS "$API_BASE_URL/actuator/health" | grep -q '"status":"UP"'; then
              echo "API is UP"
              exit 0
            fi
            sleep 1
          done
          echo "::error::API did not report UP within 60 s"
          tail -n 40 app.log
          exit 1

      - name: Run the scenarios
        working-directory: api-tests
        run: mvn -B -ntp verify "-Dapi.baseUrl=$API_BASE_URL" "-Dcucumber.filter.tags=$TAGS"

      - name: Summary
        if: ${{ !cancelled() }}
        working-directory: api-tests
        run: |
          report=target/cucumber-junit.xml
          if [ -f "$report" ]; then
            tests=$(grep -o 'tests="[0-9]*"' "$report" | head -1 | tr -dc 0-9)
            failures=$(grep -o 'failures="[0-9]*"' "$report" | head -1 | tr -dc 0-9)
            skipped=$(grep -o 'skipped="[0-9]*"' "$report" | head -1 | tr -dc 0-9)
            echo "### API acceptance: ${tests:-0} scenarios, ${failures:-0} failed, ${skipped:-0} skipped (${TAGS} → ${API_BASE_URL})" >> "$GITHUB_STEP_SUMMARY"
            # One annotation per failing scenario (first 25), readable without downloading the report.
            python3 - "$report" <<'PY'
          import sys, xml.etree.ElementTree as ET
          cases = ET.parse(sys.argv[1]).getroot().iter("testcase")
          shown = 0
          for case in cases:
              for bad in list(case.findall("failure")) + list(case.findall("error")):
                  if shown >= 25:
                      break
                  text = (bad.get("message") or bad.text or "").strip().replace("\n", " ")[:600]
                  name = (case.get("classname", "") + " :: " + case.get("name", "")).replace("::", "-").replace(",", ";")
                  print(f"::error title={name[:180]}::{text}")
                  shown += 1
          PY
          fi

      - name: Upload the Cucumber report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.report-name }}
          path: |
            api-tests/target/cucumber-report.html
            api-tests/target/cucumber-junit.xml
            api-tests/target/cucumber.json
            app.log
          if-no-files-found: ignore
          retention-days: 14
